<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bakytnur Ernat – My Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --wall:#1d3557; --wall2:#264573; --ink:#111827; --paper:#fffdf7; --n1:#ffd60a; --n2:#ff8fab; --n3:#95d5b2; --text:#f1f5f9; }
  [data-theme="sunset"] { --wall:#5b1a3a; --wall2:#7a2650; --n1:#ffb703; --n2:#8ecae6; --n3:#ffafcc; }
  [data-theme="forest"] { --wall:#14342b; --wall2:#1f4d3f; --n1:#f9c74f; --n2:#f4a261; --n3:#b7e4c7; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text); font-family:"Bricolage Grotesque",system-ui,Arial,sans-serif;
    background:radial-gradient(circle at 20% 10%,var(--wall2),var(--wall) 60%); line-height:1.5; padding:1.25rem; }
  .wrap { max-width:60rem; margin:0 auto; }
  .themes { display:flex; gap:.5rem; justify-content:flex-end; align-items:center; font-size:.9rem; }
  .themes button { width:1.6rem; height:1.6rem; border-radius:50%; border:2px solid #fff; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--n1); outline-offset:3px; }
  .hero { display:grid; gap:2rem; align-items:center; padding:2rem 0 3rem; }
  @media (min-width:44rem){ .hero{ grid-template-columns:1.4fr 1fr; } }
  h1 { font-size:clamp(3rem,11vw,6.5rem); line-height:.95; margin:0 0 1rem; font-weight:800; letter-spacing:-.03em; }
  .role { font-family:Caveat,cursive; font-size:clamp(1.8rem,5vw,2.6rem); color:var(--n1); margin:0; min-height:1.3em; }
  .polaroid { background:var(--paper); color:var(--ink); padding:.8rem .8rem 2.6rem; width:min(17rem,80%); justify-self:center;
    transform:rotate(4deg); box-shadow:0 12px 30px rgba(0,0,0,.4); position:relative; transition:transform .3s; }
  .polaroid:hover { transform:rotate(0) scale(1.03); }
  .polaroid::before { content:""; position:absolute; top:-14px; left:50%; width:6rem; height:1.7rem; background:rgba(255,214,10,.75); transform:translateX(-50%) rotate(-3deg); }
  .polaroid .pic { aspect-ratio:1; background:#dfe6ee; display:grid; place-items:center; color:#64748b; text-align:center; }
  .polaroid img { width:100%; aspect-ratio:1; object-fit:cover; object-position:center 55%; display:block; }
  .polaroid span { position:absolute; bottom:.6rem; left:0; right:0; text-align:center; font-family:Caveat,cursive; font-size:1.5rem; }
  h2 { font-size:1.8rem; margin:2.5rem 0 .3rem; }
  .hint { margin:0 0 1.5rem; opacity:.8; }
  .board { display:grid; grid-template-columns:repeat(auto-fit,minmax(13rem,1fr)); gap:1.5rem; }
  .note { border:0; text-align:left; color:var(--ink); font:inherit; padding:1.2rem; min-height:11rem; cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,.35); transition:transform .25s; }
  .note:nth-child(1){ background:var(--n1); transform:rotate(-2deg); }
  .note:nth-child(2){ background:var(--n2); transform:rotate(1.5deg); }
  .note:nth-child(3){ background:var(--n3); transform:rotate(-1deg); }
  .note:hover, .note[aria-pressed="true"] { transform:rotate(0) translateY(-4px); }
  .note b { display:block; font-size:1.4rem; margin-bottom:.4rem; }
  .note .more { display:none; }
  .note[aria-pressed="true"] .more { display:block; }
  .note[aria-pressed="true"] .front { display:none; }
  .tag { font-family:Caveat,cursive; font-size:1.2rem; opacity:.7; }
  .roulette { background:var(--paper); color:var(--ink); padding:1.5rem; border-radius:.5rem; display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between; box-shadow:0 8px 18px rgba(0,0,0,.3); }
  .roulette p { margin:0; font-size:1.2rem; flex:1 1 15rem; }
  .btn { background:var(--ink); color:#fff; border:0; padding:.7rem 1.3rem; border-radius:999px; font:inherit; font-weight:700; cursor:pointer; }
  .btn:hover { background:#374151; }
  a { color:var(--n1); }
  footer { margin:3rem 0 1rem; opacity:.75; font-size:.9rem; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="themes" role="group" aria-label="Choose colours">
    Colours:
    <button style="background:#1d3557" data-t="" aria-label="Ocean"></button>
    <button style="background:#7a2650" data-t="sunset" aria-label="Sunset"></button>
    <button style="background:#1f4d3f" data-t="forest" aria-label="Forest"></button>
  </div>

  <header class="hero">
    <div>
      <h1>Bakytnur<br>Ernat</h1>
      <p class="role" aria-live="polite">I'm a <span id="word">student</span></p>
    </div>
    <div class="polaroid">
  <div class="pic">
    <img src="photo.jpeg" alt="that's me!">
  </div>
  <span>that's me!</span>
</div>

  </header>

  <main>
    <h2>My things</h2>
    <p class="hint">Click a note to read more.</p>
    <div class="board">
      <button class="note" aria-pressed="false">
        <b>Music</b><span class="front">I can't live without it.</span><span class="more">I listen to Saddradin every day and I play the dombyra.</span>
      </button>
      <button class="note" aria-pressed="false">
        <b>Games</b><span class="front">Level up!</span><span class="more">My favourite game is CS2 because it's really fun.</span>
      </button>
      <button class="note" aria-pressed="false">
        <b>Dream</b><span class="front">Big plans.</span><span class="more">One day I want to become CyberSecurity specialist and visit Barcelona.</span>
      </button>
    </div>

    <h2>Random fact about me</h2>
    <div class="roulette">
      <p id="fact">Press the button to learn something about me.</p>
      <button class="btn" id="spin">Surprise me</button>
    </div>

    <h2>Say hi</h2>
    <p>Email: <a href="mailto:52373@iitu.edu.kz">52373@iitu.edu.kz</a></p>
  </main>

  <footer>&copy; 2026 Bakytnur Ernat. Made for ICT.</footer>
</div>

<script>
  const words = ["student", "gamer", "dreamer", "friend"];
  const facts = [
    "I was born in Saryozek.",
    "My favourite food is kazy.",
    "I can play the dombyra.",
    "My best day ever was New Year's Eve.",
    "I'm afraid of snakes."
  ];

  const word = document.getElementById("word");
  let w = 0, c = 0, del = false;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function type() {
    const cur = words[w];
    if (still) { word.textContent = cur; w = (w + 1) % words.length; return setTimeout(type, 2000); }
    word.textContent = cur.slice(0, c);
    if (!del && c === cur.length) { del = true; return setTimeout(type, 1200); }
    if (del && c === 0) { del = false; w = (w + 1) % words.length; }
    c += del ? -1 : 1;
    setTimeout(type, del ? 50 : 100);
  }
  type();

  document.querySelectorAll(".note").forEach(n =>
    n.addEventListener("click", () => n.setAttribute("aria-pressed", n.getAttribute("aria-pressed") !== "true")));

  document.getElementById("spin").addEventListener("click", () => {
    document.getElementById("fact").textContent = facts[Math.floor(Math.random() * facts.length)];
  });

  document.querySelectorAll(".themes button").forEach(b =>
    b.addEventListener("click", () => {
      if (b.dataset.t) document.body.parentElement.dataset.theme = b.dataset.t;
      else document.documentElement.removeAttribute("data-theme");
    }));
</script>
</body>
</html>
